# ──── Auth ────────────────────────────────────────────────
/auth/register:
  post:
    tags: [Auth]
    summary: Đăng ký tài khoản
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, phone, password]
            properties:
              name: { type: string, minLength: 2 }
              phone: { type: string, pattern: '^[0-9]{9,11}$' }
              email: { type: string, format: email }
              password: { type: string, minLength: 6 }
    responses:
      201: { description: Đăng ký thành công }
      400: { description: Dữ liệu không hợp lệ }

/auth/login:
  post:
    tags: [Auth]
    summary: Đăng nhập
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [phone, password]
            properties:
              phone: { type: string }
              password: { type: string }
    responses:
      200:
        description: Đăng nhập thành công
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string, description: JWT access token }
                refreshToken: { type: string, description: Refresh token }
                user: { $ref: '#/components/schemas/User' }
      401: { description: Sai thông tin đăng nhập }

/auth/refresh:
  post:
    tags: [Auth]
    summary: Refresh access token
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [refreshToken]
            properties:
              refreshToken: { type: string }
    responses:
      200: { description: Token mới }
      401: { description: Refresh token không hợp lệ }

/auth/logout:
  post:
    tags: [Auth]
    summary: Đăng xuất (revoke refresh token)
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              refreshToken: { type: string }
    responses:
      200: { description: Đăng xuất thành công }

/auth/me:
  get:
    tags: [Auth]
    summary: Lấy thông tin user hiện tại
    security: [{ bearerAuth: [] }]
    responses:
      200: { description: Thông tin user }
      401: { description: Chưa đăng nhập }

/auth/profile:
  patch:
    tags: [Auth]
    summary: Cập nhật profile
    security: [{ bearerAuth: [] }]
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              name: { type: string }
              email: { type: string, format: email }
    responses:
      200: { description: Cập nhật thành công }

/auth/password:
  patch:
    tags: [Auth]
    summary: Đổi mật khẩu
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [old_password, new_password]
            properties:
              old_password: { type: string }
              new_password: { type: string, minLength: 6 }
    responses:
      200: { description: Đổi mật khẩu thành công }

/auth/forgot-password:
  post:
    tags: [Auth]
    summary: Yêu cầu OTP quên mật khẩu
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [phone]
            properties:
              phone: { type: string }
    responses:
      200: { description: OTP đã gửi }
      404: { description: Số điện thoại không tồn tại }

/auth/verify-otp:
  post:
    tags: [Auth]
    summary: Xác thực OTP
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [phone, otp]
            properties:
              phone: { type: string }
              otp: { type: string, minLength: 6, maxLength: 6 }
    responses:
      200:
        description: OTP đúng, trả reset token
        content:
          application/json:
            schema:
              type: object
              properties:
                resetToken: { type: string }
      400: { description: OTP sai hoặc hết hạn }

/auth/reset-password:
  post:
    tags: [Auth]
    summary: Đặt lại mật khẩu
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [reset_token, new_password]
            properties:
              reset_token: { type: string }
              new_password: { type: string, minLength: 6 }
    responses:
      200: { description: Đặt lại mật khẩu thành công }

# ──── Products ────────────────────────────────────────────
/products:
  get:
    tags: [Products]
    summary: Danh sách sản phẩm
    parameters:
      - { name: category_id, in: query, schema: { type: integer } }
      - { name: search, in: query, schema: { type: string } }
      - { name: page, in: query, schema: { type: integer, default: 1 } }
      - { name: limit, in: query, schema: { type: integer, default: 20 } }
    responses:
      200: { description: Danh sách sản phẩm }

/products/{id}:
  get:
    tags: [Products]
    summary: Chi tiết sản phẩm
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    responses:
      200: { description: Chi tiết sản phẩm }
      404: { description: Không tìm thấy }

# ──── Categories ──────────────────────────────────────────
/categories:
  get:
    tags: [Categories]
    summary: Danh sách danh mục
    responses:
      200: { description: Danh sách danh mục }

# ──── Cart ────────────────────────────────────────────────
/cart:
  get:
    tags: [Cart]
    summary: Lấy giỏ hàng
    security: [{ bearerAuth: [] }]
    responses:
      200: { description: Giỏ hàng hiện tại }

/cart/add:
  post:
    tags: [Cart]
    summary: Thêm sản phẩm vào giỏ
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [product_id, quantity]
            properties:
              product_id: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1 }
    responses:
      200: { description: Thêm thành công }

# ──── Orders ──────────────────────────────────────────────
/orders:
  get:
    tags: [Orders]
    summary: Danh sách đơn hàng
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: status, in: query, schema: { type: string } }
    responses:
      200: { description: Danh sách đơn hàng }
  post:
    tags: [Orders]
    summary: Tạo đơn hàng
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [address_id, payment_method]
            properties:
              address_id: { type: string, format: uuid }
              payment_method: { type: string, enum: [cod, bank_transfer] }
              note: { type: string }
    responses:
      201: { description: Đơn hàng tạo thành công }

# ──── Admin Reports ───────────────────────────────────────
/admin/reports/revenue:
  get:
    tags: [Reports]
    summary: Doanh thu theo kỳ
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: period, in: query, schema: { type: string, enum: [daily, weekly, monthly] } }
      - { name: from, in: query, schema: { type: string, format: date } }
      - { name: to, in: query, schema: { type: string, format: date } }
    responses:
      200: { description: Doanh thu }

/admin/reports/top-products:
  get:
    tags: [Reports]
    summary: Sản phẩm bán chạy
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: limit, in: query, schema: { type: integer, default: 10 } }
    responses:
      200: { description: Top sản phẩm }

/admin/reports/order-stats:
  get:
    tags: [Reports]
    summary: Thống kê đơn hàng
    security: [{ bearerAuth: [] }]
    responses:
      200: { description: Thống kê }

/admin/reports/inventory-alerts:
  get:
    tags: [Reports]
    summary: Cảnh báo tồn kho
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: threshold, in: query, schema: { type: integer, default: 10 } }
    responses:
      200: { description: Sản phẩm hết/sắp hết hàng }

# ──── Config ──────────────────────────────────────────────
/config:
  get:
    tags: [Config]
    summary: Lấy cấu hình cửa hàng
    responses:
      200: { description: Config }
  put:
    tags: [Config]
    summary: Cập nhật cấu hình (Admin)
    security: [{ bearerAuth: [] }]
    responses:
      200: { description: Config đã cập nhật }
